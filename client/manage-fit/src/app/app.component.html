<div class="container">
    <nav *ngIf="isLoggedIn" class="nav nav-desktop" mat-primary>
        <button mat-raised-button *ngFor="let item of navItems" [routerLink]="item.path">
            {{ item.label }}
        </button>
    </nav>

    <nav *ngIf="isLoggedIn" class="nav nav-mobile" mat-primary>
        <button mat-raised-button [matMenuTriggerFor]="navMenu">
            {{ currentItem?.label ?? 'Menu' }}
            <mat-icon iconPositionEnd>arrow_drop_down</mat-icon>
        </button>
        <mat-menu #navMenu="matMenu" class="nav-menu">
            <button mat-menu-item *ngFor="let item of navItems" [routerLink]="item.path">
                {{ item.label }}
            </button>
        </mat-menu>
    </nav>

    <div class="router-outlet">
        <router-outlet />
    </div>
</div>
