<mat-form-field class="search">
    <mat-label>Search</mat-label>
    <input matInput placeholder="Search" [formControl]="searchFormControl">
</mat-form-field>
<div class="cards">
@for (exercise of filteredExercises; track $index) {
    <mat-card appearance="outlined" class="card">
        <mat-card-header>
            <mat-card-title>{{ exercise.name }}</mat-card-title>
            <mat-card-subtitle>{{ exercise.videoUrl }}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
            {{ exercise.description }}
            {{ exercise.id }} 
        </mat-card-content>
        <mat-card-actions>
            <button mat-button [routerLink]="['/exercises', exercise.id]"><mat-icon>edit</mat-icon>Edit</button>
            <button mat-button (click)="deleteExerciseDialog(exercise.id)"><mat-icon>delete</mat-icon>Remove</button>
        </mat-card-actions>
    </mat-card>
}@empty {
    <h1>There are no clients. Add clients to display them.</h1>
}
</div>
<button class="floating" mat-fab aria-label="Add exercise button" (click)="openAddExerciseDialog()">
   <mat-icon>add</mat-icon>
</button>
