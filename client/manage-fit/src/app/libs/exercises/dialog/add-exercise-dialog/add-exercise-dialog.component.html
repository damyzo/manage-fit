
<h2 mat-dialog-title>Add Exercise</h2>
<mat-dialog-content>
    <form [formGroup]="form" class="form">
        <mat-form-field>
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" placeholder="Enter a name." />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Video Url</mat-label>
          <input type="videoUrl" matInput formControlName="videoUrl" placeholder="Ex: example.com" />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Description</mat-label>
          <input type="description" matInput formControlName="description" placeholder="Ex: This is description." />
        </mat-form-field>
    </form>
</mat-dialog-content>
<mat-dialog-actions>
    <button mat-button (click)="close()">Cancel</button>
    <button mat-button (click)="save()" cdkFocusInitial>Save</button>
</mat-dialog-actions>
